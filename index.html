<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Locker Screen</title>
<style>
:root{
  --housing:#2f6f73;
  --housing-edge:#245659;
  --bezel:#1d2326;
  --screen:#f3f7f6;
  --ink:#16202a;
  --accent:#2b7a4b;
  --accent-soft:#d6ecdf;
  --card:#cfe3ea;
  --kraft:#c49a62;
  --kraft-dark:#a77c46;
  --tape:#e9dcc2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--housing);
  font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}
.housing{
  width:min(100%,960px);
  background:linear-gradient(var(--housing),var(--housing-edge));
  border-radius:22px;
  padding:clamp(14px,4vw,40px);
}
.bezel{
  background:var(--bezel);
  border-radius:14px;
  padding:clamp(8px,1.6vw,16px);
}
.screen{
  position:relative;
  aspect-ratio:4/3;
  background:var(--screen);
  border-radius:4px;
  overflow:hidden;
  cursor:pointer;
  display:grid;
  grid-template-columns:1.25fr 1fr;
  grid-template-rows:1fr auto;
}
.left{
  padding:7% 0 6% 7%;
  display:flex;flex-direction:column;justify-content:space-between;
}
.headline{
  font-weight:800;
  font-size:clamp(28px,7.4vw,72px);
  line-height:.95;
  letter-spacing:-.02em;
}
.headline span{display:block;animation:phase 6s ease-in-out infinite}
.headline span:nth-child(2){color:var(--accent);animation-delay:.35s}
@keyframes phase{
  0%,100%{opacity:1;transform:translateY(0)}
  42%{opacity:1;transform:translateY(0)}
  50%{opacity:.08;transform:translateY(4px)}
  58%{opacity:1;transform:translateY(0)}
}
.prompt{
  font-weight:700;
  font-size:clamp(15px,3.2vw,30px);
  line-height:1.1;
  max-width:9em;
}
.right{padding:6% 7% 6% 2%;display:flex}
.frame{
  position:relative;flex:1;
  border-radius:10px;overflow:hidden;
  background:var(--card);
}
.slide{
  position:absolute;inset:0;
  opacity:0;transition:opacity 1.2s ease;
}
.slide.on{opacity:1}
.slide svg{width:100%;height:100%;display:block}
.bar{
  grid-column:1/-1;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  font-size:clamp(11px,2vw,18px);
  text-align:center;
  padding:1.2% 0;
  display:flex;align-items:center;justify-content:center;gap:.6em;
}
.bar i{
  width:0;height:0;
  border-left:.5em solid transparent;border-right:.5em solid transparent;
  border-top:.55em solid #fff;
  animation:nudge 1.6s ease-in-out infinite;
}
@keyframes nudge{50%{transform:translateY(3px)}}
.scanner{
  margin:clamp(12px,3vw,28px) auto 0;
  width:34%;height:clamp(10px,2vw,18px);
  background:var(--bezel);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
}
.scanner b{width:70%;height:30%;background:#3b4448;border-radius:2px}

.entry{
  position:absolute;inset:0;
  background:var(--screen);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:4%;
  cursor:default;
}
.entry.show{display:flex}
.entry h2{font-size:clamp(18px,4vw,38px);font-weight:800;letter-spacing:-.01em}
.code{
  display:flex;gap:2%;width:70%;justify-content:center;
}
.code div{
  width:12%;aspect-ratio:3/4;
  border:2px solid var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,3.6vw,34px);font-weight:700;
  background:#fff;
}
.keys{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1.4%;width:62%;
}
.keys button{
  font:inherit;font-weight:700;font-size:clamp(13px,2.6vw,24px);
  padding:6% 0;border:0;border-radius:6px;
  background:var(--accent-soft);color:var(--ink);cursor:pointer;
}
.keys button:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.keys .wide{grid-column:span 2}
.back{
  font:inherit;font-size:clamp(12px,2vw,18px);font-weight:600;
  background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;
}
.msg{font-size:clamp(12px,2vw,18px);min-height:1.3em;color:var(--accent)}
@media (prefers-reduced-motion:reduce){
  .headline span,.bar i{animation:none}
  .slide{transition:none}
}
</style>
</head>
<body>
<div class="housing">
  <div class="bezel">
    <div class="screen" id="screen" role="button" tabindex="0" aria-label="Tap to start pickup">
      <div class="left">
        <h1 class="headline"><span>Your parcel.</span><span>Right here.</span></h1>
        <p class="prompt">Scan or tap to start</p>
      </div>
      <div class="right">
        <div class="frame" id="frame"></div>
      </div>
      <div class="bar">Scan below <i></i></div>

      <div class="entry" id="entry">
        <h2>Enter your pickup code</h2>
        <div class="code" id="code"></div>
        <div class="keys" id="keys"></div>
        <p class="msg" id="msg"></p>
        <button class="back" id="back">Back to start</button>
      </div>
    </div>
  </div>
  <div class="scanner"><b></b></div>
</div>

<script>
const kraft = (x,y,w,h,flap) => `
  <g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--kraft)"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h*0.18}" fill="var(--kraft-dark)" opacity=".55"/>
    <rect x="${x+w*0.42}" y="${y}" width="${w*0.16}" height="${h}" fill="var(--tape)" opacity=".85"/>
    ${flap ? `<rect x="${x+w*0.08}" y="${y+h*0.55}" width="${w*0.26}" height="${h*0.22}" rx="2" fill="#fff" opacity=".9"/>
    <rect x="${x+w*0.11}" y="${y+h*0.6}" width="${w*0.18}" height="${h*0.03}" fill="#9aa"/>
    <rect x="${x+w*0.11}" y="${y+h*0.67}" width="${w*0.12}" height="${h*0.03}" fill="#9aa"/>` : ''}
  </g>`;

const scenes = [
  { bg:'#cfe3ea', floor:'#b4d0d9', body:
    kraft(70,250,180,110,true)+kraft(90,170,140,80,false)+kraft(110,110,100,60,true)+
    `<circle cx="160" cy="88" r="20" fill="#e8b4c4"/><rect x="146" y="70" width="28" height="8" rx="4" fill="#7fb8a0"/>` },
  { bg:'#e4ddf0', floor:'#cfc4e3', body:
    kraft(50,230,130,130,true)+kraft(170,270,110,90,false)+
    `<rect x="190" y="230" width="70" height="40" rx="6" fill="#5fa0c9"/><rect x="200" y="238" width="50" height="6" rx="3" fill="#fff" opacity=".6"/>
     <path d="M80 230 q35 -50 70 0" stroke="#f0c75e" stroke-width="10" fill="none" stroke-linecap="round"/>` },
  { bg:'#f2e6d0', floor:'#e3d2b2', body:
    kraft(100,200,150,160,true)+
    `<rect x="60" y="300" width="40" height="60" rx="6" fill="#7fb8a0"/><rect x="66" y="290" width="28" height="12" rx="3" fill="#5c9a80"/>
     <circle cx="275" cy="335" r="25" fill="#e8b4c4"/><circle cx="275" cy="335" r="12" fill="#fff" opacity=".5"/>` },
  { bg:'#d6ecdf', floor:'#bddcc9', body:
    kraft(40,280,120,80,false)+kraft(170,260,140,100,true)+kraft(110,180,120,90,true)+
    `<rect x="240" y="220" width="16" height="40" rx="3" fill="#5fa0c9"/><rect x="234" y="214" width="28" height="10" rx="3" fill="#41779a"/>` }
];

const frame = document.getElementById('frame');
scenes.forEach((s,i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (i===0 ? ' on' : '');
  d.innerHTML = `<svg viewBox="0 0 340 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="340" height="420" fill="${s.bg}"/>
    <rect y="350" width="340" height="70" fill="${s.floor}"/>
    ${s.body}</svg>`;
  frame.appendChild(d);
});

let idx = 0;
setInterval(() => {
  const slides = frame.children;
  slides[idx].classList.remove('on');
  idx = (idx + 1) % slides.length;
  slides[idx].classList.add('on');
}, 6000);

const screen = document.getElementById('screen');
const entry = document.getElementById('entry');
const codeEl = document.getElementById('code');
const keysEl = document.getElementById('keys');
const msg = document.getElementById('msg');
const LEN = 6;
let code = '';

for (let i = 0; i < LEN; i++) codeEl.appendChild(document.createElement('div'));
['1','2','3','4','5','6','7','8','9','0'].forEach(k => {
  const b = document.createElement('button'); b.textContent = k; b.dataset.k = k; keysEl.appendChild(b);
});
const del = document.createElement('button'); del.textContent = 'Delete'; del.dataset.k = 'del'; del.className = 'wide';
const ok = document.createElement('button'); ok.textContent = 'Open locker'; ok.dataset.k = 'ok'; ok.className = 'wide';
const sp = document.createElement('span');
keysEl.append(del, sp, ok);

function draw(){ [...codeEl.children].forEach((c,i) => c.textContent = code[i] || ''); }

function openEntry(){ entry.classList.add('show'); code=''; msg.textContent=''; draw(); }
screen.addEventListener('click', e => { if (!entry.classList.contains('show')) openEntry(); });
screen.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && !entry.classList.contains('show')) { e.preventDefault(); openEntry(); } });

keysEl.addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  e.stopPropagation();
  if (k === 'del') code = code.slice(0,-1);
  else if (k === 'ok') {
    msg.textContent = code.length === LEN ? 'Opening locker ' + (Number(code) % 48 + 1) : 'Enter all ' + LEN + ' digits';
  }
  else if (code.length < LEN) code += k;
  draw();
});

document.getElementById('back').addEventListener('click', e => {
  e.stopPropagation(); entry.classList.remove('show');
});

let idle;
['click','keydown'].forEach(ev => document.addEventListener(ev, () => {
  clearTimeout(idle);
  idle = setTimeout(() => entry.classList.remove('show'), 30000);
}));
</script>
</body>
</html>

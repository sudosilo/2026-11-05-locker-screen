<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Locker Screen</title>
<style>
:root{
  --housing:#2f6f73;--housing-edge:#245659;--bezel:#1d2326;
  --screen:#f3f7f6;--ink:#16202a;--muted:#4a5862;--line:#9fb1b6;
  --accent:#2b7a4b;--accent-soft:#d6ecdf;--card:#cfe3ea;
  --kraft:#c49a62;--kraft-dark:#a77c46;--tape:#e9dcc2;
}
.hc{--screen:#ffffff;--ink:#000000;--muted:#000000;--line:#000000;--accent:#0b5a2c;--accent-soft:#ffffff}
.hc .btn,.hc .key,.hc .box,.hc .tabs button,.hc .row{border-width:3px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--housing);font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.housing{width:min(100%,960px);background:linear-gradient(var(--housing),var(--housing-edge));border-radius:22px;padding:clamp(14px,4vw,40px)}
.bezel{background:var(--bezel);border-radius:14px;padding:clamp(8px,1.6vw,16px)}
.screen{position:relative;aspect-ratio:4/3;background:var(--screen);border-radius:4px;overflow:hidden;font-size:clamp(9px,1.9vw,18px)}
.view{position:absolute;inset:0;display:none}
.view.show{display:flex}
.scanner{margin:clamp(12px,3vw,28px) auto 0;width:34%;height:clamp(10px,2vw,18px);background:var(--bezel);border-radius:3px;display:flex;align-items:center;justify-content:center}
.scanner b{width:70%;height:30%;background:#3b4448;border-radius:2px;transition:background .2s}
.scanner b.lit{background:#d94a3a;box-shadow:0 0 10px #d94a3a}

/* attract */
#attract{display:none;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr auto;cursor:pointer}
#attract.show{display:grid}
.a-left{padding:7% 0 6% 7%;display:flex;flex-direction:column;justify-content:space-between}
.headline{font-weight:800;font-size:4em;line-height:.95;letter-spacing:-.02em}
.headline span{display:block;animation:phase 6s ease-in-out infinite}
.headline span:nth-child(2){color:var(--accent);animation-delay:.35s}
@keyframes phase{0%,42%,58%,100%{opacity:1;transform:none}50%{opacity:.08;transform:translateY(4px)}}
.prompt{font-weight:700;font-size:1.7em;line-height:1.1;max-width:9em}
.a-right{padding:6% 7% 6% 2%;display:flex}
.frame{position:relative;flex:1;border-radius:10px;overflow:hidden;background:var(--card)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide svg{width:100%;height:100%;display:block}
.bar{grid-column:1/-1;background:var(--accent);color:#fff;font-weight:600;text-align:center;padding:1.2% 0;display:flex;align-items:center;justify-content:center;gap:.6em}
.bar i{width:0;height:0;border-left:.5em solid transparent;border-right:.5em solid transparent;border-top:.55em solid #fff;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}

/* shared layout for scan and entry */
.stack{flex-direction:column}
.main{flex:1;display:flex;position:relative}
.foot{display:flex;gap:2.5%;padding:0 5% 4%;align-items:center}
.foot .spacer{flex:1}
.btn{font:inherit;font-size:1em;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:3px;padding:.7em 1.1em;display:flex;align-items:center;gap:.5em;cursor:pointer}
.btn svg{width:1.1em;height:1.1em}
.btn:focus-visible,.key:focus-visible,.tabs button:focus-visible,.row:focus-visible,.x:focus-visible,.lang button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* scan */
.s-left{flex:1.5;padding:9% 2% 0 7%;display:flex;flex-direction:column;gap:1.4em;justify-content:center}
.s-head{font-weight:800;font-size:3.6em;line-height:1;letter-spacing:-.02em;max-width:7.5em}
.s-sub{font-size:1.45em;line-height:1.3;color:var(--muted);max-width:19em}
.s-right{flex:1;padding:6% 7% 2% 0;display:flex;cursor:pointer}
.s-right svg{width:100%;height:100%}
.beam{animation:beam 2.4s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.75}}

/* entry */
.e-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:3%;gap:4%}
.tabs{display:flex}
.tabs button{font:inherit;font-size:1.45em;padding:.45em 1.1em;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--screen);border-color:var(--ink)}
.boxes{display:flex;gap:1.2em}
.box{width:3.6em;height:3.6em;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,4.6em);gap:.5em .7em;justify-content:center}
.key{width:4.6em;height:4.6em;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1em;cursor:pointer}
.key span{font-size:1.9em}
.key:active{background:var(--accent-soft)}
.key.plain{border:0}
.key.plain svg{width:2.2em;height:2.2em}
.e-msg{min-height:1.3em;font-size:1.2em;color:var(--accent);font-weight:600}

/* result */
#result{flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center}
.r-num{font-size:9em;font-weight:800;line-height:1;color:var(--accent)}
.r-head{font-size:2.6em;font-weight:800}
.r-sub{font-size:1.4em;color:var(--muted)}

/* modals */
.scrim{position:absolute;inset:0;background:rgba(22,32,42,.45);display:none;align-items:center;justify-content:center}
.scrim.show{display:flex}
.modal{background:var(--screen);width:74%;border-radius:2px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.m-top{background:var(--ink);color:var(--screen);display:flex;justify-content:space-between;align-items:center;padding:.7em 1.1em;font-size:1.3em;font-weight:600}
.x{background:none;border:0;color:inherit;font:inherit;font-size:1.3em;cursor:pointer;line-height:1;padding:0 .2em}
.lang{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;padding:1.4em}
.lang button{font:inherit;font-size:1.4em;padding:.5em;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.lang button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.list{padding:.6em 1.6em 1em}
.group{font-size:1.25em;font-weight:600;padding:.8em 0 .5em;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;width:100%;font:inherit;font-size:1.2em;text-align:left;padding:.7em .6em;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.detail{background:var(--screen);width:60%;padding:2em 2.4em 2.2em;position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1em}
.detail .x{position:absolute;top:.5em;right:.7em;color:var(--ink)}
.detail h3{font-size:2em;font-weight:700}
.detail p{font-size:1.3em;line-height:1.35;color:var(--muted)}
.detail canvas{width:7em;height:7em;image-rendering:pixelated}


/* tracking keyboard */
.tin{width:78%;height:3em;border:1.5px solid var(--line);border-radius:1.5em;display:flex;align-items:center;justify-content:center;font-size:1.3em;letter-spacing:.04em}
.tin.empty{color:var(--muted);font-size:1.15em;letter-spacing:0}
.kb{display:flex;flex-direction:column;gap:.35em;align-items:center;width:92%}
.kb div{display:flex;gap:.35em;justify-content:center;width:100%}
.kk{flex:0 0 7.6%;height:3.4em;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:1em;cursor:pointer}
.kk span{font-size:1.6em}
.kk:active{background:var(--accent-soft)}
.kk.sub{flex:0 0 14%;background:var(--ink);color:var(--screen);border-color:var(--ink);font-weight:700}
.kk.sub span{font-size:1.1em}
.kk svg{width:1.8em;height:1.8em}

/* tech screens */
.tech .foot{background:#cfe6f2;padding:2.6% 5%;margin:0}
.hc .tech .foot{background:#ffffff;border-top:3px solid #000}
.sig{position:absolute;top:2.4%;right:3.5%;font-size:1em;color:var(--muted);display:flex;align-items:center;gap:.5em}
.sig svg{width:1.3em;height:1em}
.ts-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:6% 5% 0;gap:1em}
.ts-title{font-size:2.3em;font-weight:700}
.ts-sub{font-size:1.3em;color:var(--muted);display:flex;align-items:center;gap:.5em}
.bang{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;background:#c0392b;color:#fff;font-weight:800;font-size:.9em;flex:none}
.bang.big{width:2.2em;height:2.2em;font-size:1.6em}
.okdot{display:inline-flex;align-items:center;justify-content:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:1.6em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em;width:100%;margin-top:.6em}
.tile{font:inherit;font-size:1.45em;padding:.7em .4em;border:1px solid #a9cdd9;background:#bfe0e8;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5em}
.tile.bad{background:#e6e8e6;border-color:#c9cfcf}
.hc .tile{background:#fff;border:3px solid #000}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;text-align:center;padding:0 6%}
.center h3{font-size:2em;font-weight:700}
.center p{font-size:1.3em;color:var(--muted)}
.primary{font:inherit;font-size:1.35em;padding:.6em 1.2em;background:#1f5f7a;color:#fff;border:0;cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.ghost{font:inherit;font-size:1.35em;padding:.6em 1.2em;background:transparent;color:#1f5f7a;border:1.5px solid #1f5f7a;cursor:pointer}
.soft{font:inherit;font-size:1.35em;padding:.6em 1.2em;background:#c4dfe6;color:var(--ink);border:0;cursor:pointer}
.soft:disabled{opacity:.45;cursor:default}
.door{flex:1;display:flex;padding:3% 4% 2%}
.colwrap{flex:0 0 30%;display:flex;flex-direction:column;align-items:center}
.colname{font-size:1.4em;color:var(--muted);margin-bottom:.4em}
.col{position:relative;width:38%;flex:1;display:flex;flex-direction:column;gap:2px}
.cell{flex:1;background:#b9c6ca;position:relative}
.cell:first-child{border-radius:6px 6px 0 0}
.cell:last-child{border-radius:0 0 6px 6px}
.cell.off{background:#c0392b}
.cell.open{background:var(--kraft-dark)}
.cell i{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:.95em;color:var(--muted);white-space:nowrap}
.cell i.l{right:calc(100% + .4em)}
.cell i.r{left:calc(100% + .4em)}
.dside{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.7em;padding-left:3%}
.dside h3{font-size:2em;font-weight:700;text-align:center}
.dside h4{font-size:1.35em;font-weight:600;text-align:center}
.steps{font-size:1.2em;line-height:1.4;color:var(--ink);align-self:stretch;display:flex;flex-direction:column;gap:.35em;margin:.4em 0}
.drow{display:flex;gap:.8em;margin-top:.6em;flex-wrap:wrap;justify-content:center}
.bar2{width:60%;height:.7em;background:#d7e3e6;border-radius:.35em;overflow:hidden}
.bar2 b{display:block;height:100%;width:0;background:var(--accent);transition:width 1.6s linear}
.info{padding:1.2em 1.6em;display:grid;grid-template-columns:auto 1fr;gap:.6em 1.6em;font-size:1.25em}
.info span:nth-child(odd){color:var(--muted)}

@media (prefers-reduced-motion:reduce){.headline span,.bar i,.beam{animation:none}.slide{transition:none}}
</style>
</head>
<body>
<div class="housing" id="housing">
  <div class="bezel">
    <div class="screen" id="screen">

      <div class="view show" id="attract" role="button" tabindex="0">
        <div class="a-left">
          <h1 class="headline"><span data-t="p1"></span><span data-t="p2"></span></h1>
          <p class="prompt" data-t="tap"></p>
        </div>
        <div class="a-right"><div class="frame" id="frame"></div></div>
        <div class="bar"><span data-t="below"></span> <i></i></div>
      </div>

      <div class="view stack" id="scan">
        <div class="main">
          <div class="s-left">
            <h2 class="s-head" data-t="sHead"></h2>
            <p class="s-sub" data-t="sSub"></p>
          </div>
          <div class="s-right" id="fakeScan" title="Simulate a scan">
            <svg viewBox="0 0 160 260" aria-hidden="true">
              <rect x="6" y="6" width="148" height="248" fill="#cbd6d9"/>
              <rect x="6" y="20" width="148" height="3" fill="#b3c0c4"/>
              <rect x="70" y="34" width="20" height="10" fill="#26303a"/>
              <rect x="20" y="52" width="120" height="100" fill="#b9c6ca" stroke="#9fb1b6"/>
              <rect x="32" y="62" width="96" height="62" fill="#26303a"/>
              <rect x="38" y="68" width="84" height="50" fill="#2b7a4b"/>
              <circle cx="80" cy="93" r="13" fill="none" stroke="#fff" stroke-width="3"/>
              <path d="M74 93l4 4 8-8" stroke="#fff" stroke-width="3" fill="none"/>
              <rect x="30" y="132" width="20" height="12" fill="#a7b5b9"/><rect x="56" y="132" width="12" height="12" fill="#a7b5b9"/><rect x="88" y="132" width="40" height="12" fill="#a7b5b9"/>
              <rect x="6" y="160" width="148" height="2" fill="#b3c0c4"/>
              <rect x="70" y="168" width="20" height="8" fill="#26303a"/>
              <polygon class="beam" points="72,176 88,176 112,214 48,214" fill="#d94a3a"/>
              <rect x="34" y="200" width="92" height="44" rx="4" fill="#fff" stroke="#16202a" stroke-width="2"/>
              <g fill="#16202a">
                <rect x="42" y="207" width="3" height="30"/><rect x="48" y="207" width="2" height="30"/><rect x="53" y="207" width="4" height="30"/><rect x="60" y="207" width="2" height="30"/><rect x="65" y="207" width="3" height="30"/><rect x="71" y="207" width="5" height="30"/><rect x="79" y="207" width="2" height="30"/><rect x="84" y="207" width="3" height="30"/><rect x="90" y="207" width="2" height="30"/><rect x="95" y="207" width="4" height="30"/><rect x="102" y="207" width="2" height="30"/><rect x="107" y="207" width="3" height="30"/><rect x="113" y="207" width="5" height="30"/>
              </g>
              <rect x="38" y="221" width="84" height="2" fill="#d94a3a"/>
            </svg>
          </div>
        </div>
        <div class="foot">
          <button class="btn" data-act="enter"><svg viewBox="0 0 12 12"><g fill="currentColor"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="10" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/><circle cx="10" cy="10" r="1"/></g></svg><span data-t="enter"></span></button>
          <button class="btn" data-act="help"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" fill="currentColor">?</text></svg><span data-t="help"></span></button>
          <button class="btn" data-act="lang"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><ellipse cx="10" cy="10" rx="3.8" ry="8.5"/><path d="M1.5 10h17"/></svg><span data-t="language"></span></button>
          <span class="spacer"></span>
          <button class="btn" data-act="contrast"><span data-t="contrast"></span></button>
        </div>
      </div>

      <div class="view stack" id="entry">
        <div class="main">
          <div class="e-wrap">
            <div class="tabs"><button id="tCode" class="on" data-t="tabCode"></button><button id="tTrack" data-t="tabTrack"></button></div>
            <div class="boxes" id="boxes"></div>
            <div class="tin empty" id="track" hidden></div>
            <div class="pad" id="pad"></div>
            <div class="kb" id="kb" hidden></div>
            <div class="e-msg" id="emsg"></div>
          </div>
        </div>
        <div class="foot">
          <button class="btn" data-act="exit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><path d="M7 7l6 6M13 7l-6 6"/></svg><span data-t="exit"></span></button>
          <button class="btn" data-act="help"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" fill="currentColor">?</text></svg><span data-t="help"></span></button>
          <button class="btn" data-act="lang"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><ellipse cx="10" cy="10" rx="3.8" ry="8.5"/><path d="M1.5 10h17"/></svg><span data-t="language"></span></button>
          <span class="spacer"></span>
          <button class="btn" data-act="contrast"><span data-t="contrast"></span></button>
        </div>
      </div>

      <div class="view" id="result">
        <p class="r-head" data-t="rHead"></p>
        <div class="r-num" id="rnum"></div>
        <p class="r-sub" data-t="rSub"></p>
      </div>


      <div class="view stack tech" id="ts">
        <div class="sig"><span data-t="net"></span><svg viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="9" width="2" height="3"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg></div>
        <div class="ts-wrap">
          <h2 class="ts-title" data-t="tsTitle"></h2>
          <p class="ts-sub" id="tsSub"></p>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="foot"><button class="btn" data-act="exit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><path d="M7 7l6 6M13 7l-6 6"/></svg><span data-t="exit"></span></button><button class="btn" data-act="details"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><path d="M10 5.5v6"/><circle cx="10" cy="14.2" r=".6" fill="currentColor"/></svg><span data-t="details"></span></button><button class="btn" data-act="lang"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><ellipse cx="10" cy="10" rx="3.8" ry="8.5"/><path d="M1.5 10h17"/></svg><span data-t="language"></span></button><span class="spacer"></span><button class="btn" data-act="contrast"><span data-t="contrast"></span></button></div>
      </div>

      <div class="view stack tech" id="offline">
        <div class="sig"><span data-t="net"></span><svg viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="9" width="2" height="3"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg></div>
        <div class="center" id="offBody"></div>
        <div class="foot"><button class="btn" data-act="tsback"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><path d="M7 7l6 6M13 7l-6 6"/></svg><span data-t="exit"></span></button><button class="btn" data-act="lang"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8.5"/><ellipse cx="10" cy="10" rx="3.8" ry="8.5"/><path d="M1.5 10h17"/></svg><span data-t="language"></span></button><span class="spacer"></span><button class="btn" data-act="contrast"><span data-t="contrast"></span></button></div>
      </div>

      <div class="view stack tech" id="door">
        <div class="sig"><span data-t="net"></span><svg viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="9" width="2" height="3"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg></div>
        <div class="door">
          <div class="colwrap"><div class="colname" id="colName"></div><div class="col" id="col"></div></div>
          <div class="dside" id="dside"></div>

const t = k => T[lang][k];
function paint(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  buildHelp(); buildLangs(); drawEntry(); drawTech();

/* attract slides */
const kraft=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--kraft)"/><rect x="${x}" y="${y}" width="${w}" height="${h*.18}" fill="var(--kraft-dark)" opacity=".55"/><rect x="${x+w*.42}" y="${y}" width="${w*.16}" height="${h}" fill="var(--tape)" opacity=".85"/>`+(f?`<rect x="${x+w*.08}" y="${y+h*.55}" width="${w*.26}" height="${h*.22}" rx="2" fill="#fff" opacity=".9"/><rect x="${x+w*.11}" y="${y+h*.6}" width="${w*.18}" height="${h*.03}" fill="#9aa"/><rect x="${x+w*.11}" y="${y+h*.67}" width="${w*.12}" height="${h*.03}" fill="#9aa"/>`:'');
const scenes=[
  ['#cfe3ea','#b4d0d9',kraft(70,250,180,110,1)+kraft(90,170,140,80,0)+kraft(110,110,100,60,1)+`<circle cx="160" cy="88" r="20" fill="#e8b4c4"/><rect x="146" y="70" width="28" height="8" rx="4" fill="#7fb8a0"/>`],
  ['#e4ddf0','#cfc4e3',kraft(50,230,130,130,1)+kraft(170,270,110,90,0)+`<rect x="190" y="230" width="70" height="40" rx="6" fill="#5fa0c9"/><path d="M80 230 q35 -50 70 0" stroke="#f0c75e" stroke-width="10" fill="none" stroke-linecap="round"/>`],
  ['#f2e6d0','#e3d2b2',kraft(100,200,150,160,1)+`<rect x="60" y="300" width="40" height="60" rx="6" fill="#7fb8a0"/><rect x="66" y="290" width="28" height="12" rx="3" fill="#5c9a80"/><circle cx="275" cy="335" r="25" fill="#e8b4c4"/><circle cx="275" cy="335" r="12" fill="#fff" opacity=".5"/>`],
  ['#d6ecdf','#bddcc9',kraft(40,280,120,80,0)+kraft(170,260,140,100,1)+kraft(110,180,120,90,1)+`<rect x="240" y="220" width="16" height="40" rx="3" fill="#5fa0c9"/><rect x="234" y="214" width="28" height="10" rx="3" fill="#41779a"/>`]
];
const frame=document.getElementById('frame');
scenes.forEach(([bg,fl,body],i)=>{const d=document.createElement('div');d.className='slide'+(i?'':' on');
  d.innerHTML=`<svg viewBox="0 0 340 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="340" height="420" fill="${bg}"/><rect y="350" width="340" height="70" fill="${fl}"/>${body}</svg>`;frame.appendChild(d);});
let si=0;setInterval(()=>{const s=frame.children;s[si].classList.remove('on');si=(si+1)%s.length;s[si].classList.add('on');},6000);

/* navigation */
const views=['attract','scan','entry','result','ts','offline','door','part'];
function go(v){if(['ts','offline','door','part'].includes(v))techView=v;views.forEach(id=>document.getElementById(id).classList.toggle('show',id===v));closeModals();}
function closeModals(){document.querySelectorAll('.scrim').forEach(m=>m.classList.remove('show'));}
function modal(id){closeModals();document.getElementById(id).classList.add('show');}
document.getElementById('attract').addEventListener('click',()=>go('scan'));
document.getElementById('attract').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('scan');}});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModals));
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)closeModals();}));
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='enter'){mode='code';val='';msg='';go('entry');}
  if(a==='exit')go('attract');
  if(a==='help')modal('helpModal');
  if(a==='lang')modal('langModal');
  if(a==='contrast')document.getElementById('housing').classList.toggle('hc');
  if(a==='details'){drawInfo();modal('infoModal');}
  if(a==='tsback'){techView='ts';drawTech();go('ts');}
}));

/* scan simulation */
document.getElementById('fakeScan').addEventListener('click',()=>{
  const lamp=document.getElementById('lamp');lamp.classList.add('lit');
  setTimeout(()=>{lamp.classList.remove('lit');openLocker();},700);
});

/* entry */
let mode='code',val='',msg='';
const boxes=document.getElementById('boxes'),track=document.getElementById('track'),pad=document.getElementById('pad'),kb=document.getElementById('kb');
for(let i=0;i<6;i++){const b=document.createElement('div');b.className='box';boxes.appendChild(b);}
const delSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 5h12v14H8l-6-7z"/><path d="M11 9l6 6M17 9l-6 6"/></svg>';
['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k=>{
  if(!k){pad.appendChild(document.createElement('span'));return;}
  const b=document.createElement('button');b.className='key'+(k==='del'?' plain':'');b.dataset.k=k;
  b.innerHTML=k==='del'?delSvg:`<span>${k}</span>`;
  b.setAttribute('aria-label',k==='del'?'Delete':k);pad.appendChild(b);
});
[['1','2','3','4','5','6','7','8','9','0','del'],['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','sub']].forEach(row=>{
  const r=document.createElement('div');
  row.forEach(k=>{const b=document.createElement('button');b.className='kk'+(k==='sub'?' sub':'');b.dataset.k=k;
    b.innerHTML=k==='del'?delSvg:k==='sub'?'<span data-t="submit"></span>':`<span>${k}</span>`;
    if(k==='del')b.setAttribute('aria-label','Delete');r.appendChild(b);});
  kb.appendChild(r);
});
pad.addEventListener('click',e=>{
  const b=e.target.closest('.key');if(!b)return;const k=b.dataset.k;msg='';
  if(k==='del')val=val.slice(0,-1);
  else if(val.length<6){val+=k;if(val.length===6)setTimeout(check,250);}
  drawEntry();
});
kb.addEventListener('click',e=>{
  const b=e.target.closest('.kk');if(!b)return;const k=b.dataset.k;msg='';
  if(k==='del')val=val.slice(0,-1);
  else if(k==='sub'){if(val.length<8)msg=t('needT');else{check();return;}}
  else if(val.length<22)val+=k;
  drawEntry();
});
function check(){
  if(mode==='code'&&val==='999999'){val='';openTech();return;}
  if(mode==='code'&&val==='000000'){msg=t('bad');val='';drawEntry();return;}
  openLocker();
}
document.getElementById('tCode').addEventListener('click',()=>{mode='code';val='';msg='';drawEntry();});
document.getElementById('tTrack').addEventListener('click',()=>{mode='track';val='';msg='';drawEntry();});
function drawEntry(){
  document.getElementById('tCode').classList.toggle('on',mode==='code');
  document.getElementById('tTrack').classList.toggle('on',mode==='track');
  boxes.hidden=pad.hidden=mode!=='code';track.hidden=kb.hidden=mode!=='track';
  [...boxes.children].forEach((b,i)=>b.textContent=val[i]||'');
  track.textContent=val||t('trackHint');track.classList.toggle('empty',!val);
  kb.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.getElementById('emsg').textContent=msg;
}

/* tech mode */
const parts=['tScan','tKey','tNet','tCol','tCam','tAud','tSpk'];
let offline=[],techView='ts',doorStep='issue',curPart='',testState='';
function openTech(){
  const n=Math.random()<.7?1:2;offline=[];
  while(offline.length<n){const c=Math.floor(Math.random()*12)+1,sl=Math.floor(Math.random()*10)+1;if(!offline.some(o=>o.c===c&&o.s===sl))offline.push({c,s:sl});}
  techView='ts';drawTech();go('ts');
}
function drawTech(){
  const sub=document.getElementById('tsSub');if(!sub)return;
  sub.innerHTML=offline.length?`<span class="bang">!</span><span>${t('tsBad')}</span>`:`<span>${t('tsOk')}</span>`;
  const tiles=document.getElementById('tiles');tiles.innerHTML='';
  ['tOff',...parts].forEach(k=>{const b=document.createElement('button');b.className='tile'+(k==='tOff'&&offline.length?' bad':'');
    b.innerHTML=(k==='tOff'&&offline.length?'<span class="bang">!</span>':'')+`<span>${t(k)}</span>`;
    b.addEventListener('click',()=>{if(k==='tOff'){techView='offline';drawOffline();go('offline');}else{curPart=k;testState='';drawPart();go('part');}});
    tiles.appendChild(b);});
  if(techView==='offline')drawOffline();
  if(techView==='door')drawDoor();
  if(techView==='part')drawPart();
}
function drawOffline(){
  const n=offline.length,body=document.getElementById('offBody');
  body.innerHTML=n?`<span class="bang big">!</span><h3>${n===1?t('off1'):tf('offN',{n})}</h3><button class="primary" id="goFirst">${t('connect')}</button>`
    :`<span class="okdot">&#10003;</span><h3>${t('off0')}</h3><button class="ghost" id="goBack">${t('back')}</button>`;
  const f=document.getElementById('goFirst');if(f)f.onclick=()=>{techView='door';doorStep='issue';drawDoor();go('door');};
  const g=document.getElementById('goBack');if(g)g.onclick=()=>{techView='ts';drawTech();go('ts');};
}
function drawDoor(){
  const o=offline[0];if(!o)return;
  document.getElementById('colName').textContent=tf('column',{c:o.c});
  const col=document.getElementById('col');col.innerHTML='';
  for(let i=1;i<=10;i++){const c=document.createElement('div');
    c.className='cell'+(i===o.s?(doorStep==='issue'?' off':doorStep==='closed'?'':' open'):'');
    c.innerHTML=`<i class="${i%2?'l':'r'}">${i}</i>`;col.appendChild(c);}
  const d=document.getElementById('dside');
  if(doorStep==='issue'||doorStep==='closed'){
    d.innerHTML=`<span class="bang big">!</span><h3>${t('doorTitle')}</h3><h4>${tf('doorSub',{c:o.c,s:o.s})}</h4>
      <div class="steps"><span>${t('s1')}</span><span>${t('s2')}</span><span>${t('s3')}</span><span>${t('s4')}</span></div>
      <div class="drow"><button class="ghost" id="dSkip">${t('skip')}</button><button class="soft" id="dFix" ${doorStep==='closed'?'':'disabled'}>${t('fixed')}</button><button class="primary" id="dOpen">${t('openDoor')}</button></div>`;
    document.getElementById('dSkip').onclick=()=>{offline.push(offline.shift());if(offline.length>1){doorStep='issue';drawDoor();}else{techView='ts';drawTech();go('ts');}};
    document.getElementById('dOpen').onclick=()=>{doorStep='opening';drawDoor();setTimeout(()=>{doorStep='ask';drawDoor();},1400);};
    document.getElementById('dFix').onclick=()=>{doorStep='cleared';drawDoor();};
  }else if(doorStep==='opening'){
    d.innerHTML=`<h3>${t('opening')}</h3><div class="bar2"><b id="ob"></b></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById('ob');if(b)b.style.width='100%';}));
  }else if(doorStep==='ask'){
    d.innerHTML=`<h3>${t('isPkg')}</h3><div class="drow"><button class="soft" id="dNo">${t('no')}</button><button class="primary" id="dYes">${t('yes')}</button></div>`;
    document.getElementById('dNo').onclick=()=>{doorStep='closed';drawDoor();};
    document.getElementById('dYes').onclick=()=>{doorStep='remove';drawDoor();};
  }else if(doorStep==='remove'){
    d.innerHTML=`<h3>${t('removePkg')}</h3><div class="drow"><button class="primary" id="dDone">${t('done')}</button></div>`;
    document.getElementById('dDone').onclick=()=>{doorStep='closed';drawDoor();};
  }else if(doorStep==='cleared'){
    col.querySelectorAll('.cell').forEach(c=>c.classList.remove('off','open'));
    d.innerHTML=`<span class="okdot">&#10003;</span><h3>${tf('cleared',{c:o.c,s:o.s})}</h3><div class="drow"><button class="primary" id="dNext">${t('done')}</button></div>`;
    document.getElementById('dNext').onclick=()=>{offline.shift();doorStep='issue';if(offline.length){drawDoor();}else{techView='offline';drawOffline();go('offline');}};
  }
}
function drawPart(){
  const body=document.getElementById('partBody');if(!curPart)return;
  const name=t(curPart);
  if(testState==='run'){body.innerHTML=`<h3>${t('testing')}</h3><div class="bar2"><b id="pb"></b></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById('pb');if(b)b.style.width='100%';}));return;}
  body.innerHTML=`<span class="okdot">&#10003;</span><h3>${testState==='pass'?t('passed'):tf('working',{p:name})}</h3><button class="primary" id="pTest">${t('runTest')}</button>`;
  document.getElementById('pTest').onclick=()=>{testState='run';drawPart();setTimeout(()=>{testState='pass';drawPart();},1700);};
}
function drawInfo(){
  const now=new Date();
  document.getElementById('info').innerHTML=`<span>${t('iName')}</span><span>Unit xxxx</span><span>${t('iCols')}</span><span>12</span><span>${t('iSlots')}</span><span>120</span><span>${t('iVer')}</span><span>4.2.0</span><span>${t('iUp')}</span><span>${now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>`;
}

/* result */
let rTimer;
function openLocker(){
  document.getElementById('rnum').textContent=Math.floor(Math.random()*48)+1;
  go('result');clearTimeout(rTimer);rTimer=setTimeout(()=>go('attract'),8000);
}

/* language */
function buildLangs(){
  const box=document.getElementById('langs');box.innerHTML='';
  Object.keys(T).forEach(code=>{const b=document.createElement('button');b.textContent=T[code].name;b.className=code===lang?'on':'';
    b.addEventListener('click',()=>{lang=code;paint();closeModals();});box.appendChild(b);});
}

/* help */
function buildHelp(){
  const list=document.getElementById('helpList');list.innerHTML='';
  const add=(g,items)=>{const h=document.createElement('div');h.className='group';h.textContent=t(g);list.appendChild(h);
    items.forEach(n=>{const r=document.createElement('button');r.className='row';r.innerHTML=`<span>${t('h'+n)}</span><span aria-hidden="true">&#8250;</span>`;
      r.addEventListener('click',()=>showDetail(n));list.appendChild(r);});};
  add('gCust',[1,2,3,4]);add('gCarr',[5,6]);
}
function showDetail(n){
  document.getElementById('dTitle').textContent=t('h'+n);
  document.getElementById('dBody').textContent=t('b'+n);
  document.getElementById('dBody2').textContent=t('b'+n+'b');
  document.getElementById('qr').hidden=n!==1;
  modal('detailModal');
}

/* decorative square code */
(function(){
  const c=document.getElementById('qr').getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,25,25);c.fillStyle='#16202a';
  for(let y=0;y<25;y++)for(let x=0;x<25;x++)if(Math.random()<.5)c.fillRect(x,y,1,1);
  [[0,0],[18,0],[0,18]].forEach(([x,y])=>{c.fillStyle='#16202a';c.fillRect(x,y,7,7);c.fillStyle='#fff';c.fillRect(x+1,y+1,5,5);c.fillStyle='#16202a';c.fillRect(x+2,y+2,3,3);
    c.fillStyle='#fff';if(x===0&&y===0){c.fillRect(7,0,1,8);c.fillRect(0,7,8,1);}if(x===18){c.fillRect(17,0,1,8);c.fillRect(17,7,8,1);}if(y===18){c.fillRect(7,17,1,8);c.fillRect(0,17,8,1);}});
})();

/* idle back to start */
let idle;
['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(idle);idle=setTimeout(()=>go('attract'),45000);}));

paint();
</script>
</body>
</html>
